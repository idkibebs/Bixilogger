name: BIXI GBFS logger

on:
  schedule:
    # Every 10 minutes (UTC). GitHub may delay or occasionally skip scheduled
    # runs under load — fine for detecting empty/full episodes.
    - cron: "*/10 * * * *"
  workflow_dispatch:   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write       # allow the workflow to commit the data back

concurrency:
  group: bixi-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot the live feed
        run: python log_status.py

      - name: Commit new data
        run: |
          git config user.name "bixi-logger"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "log: $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

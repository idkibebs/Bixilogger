name: BIXI GBFS logger

on:
  # SCHEDULE DISABLED 2026-08-20 — project complete (final graded), logger stopped.
  # To resume collection, uncomment the schedule block below.
  # schedule:
  #   # Frequent restart attempts. Because of the concurrency guard below, while a
  #   # long run is alive these just sit as a single "pending" run and start the
  #   # moment the active run ends — so logging stays continuous even though
  #   # GitHub delays/throttles cron timing.
  #   - cron: "*/20 * * * *"
  workflow_dispatch:   # can still be run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: bixi-logger
  cancel-in-progress: false   # never kill the active logger; keep one run pending

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # ~5h50m; the loop exits cleanly at 340 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "bixi-logger"
          git config user.email "actions@users.noreply.github.com"

      - name: Run logging loop (snapshot every 5 min for ~5.5h)
        run: python log_loop.py
